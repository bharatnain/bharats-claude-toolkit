name: validate-skills
on:
  push:
    paths: ['skills/**', 'agents/**', 'SKILLS.md', 'scripts/validate_skills.py', '.github/workflows/validate-skills.yml']
  pull_request:
    paths: ['skills/**', 'agents/**', 'SKILLS.md', 'scripts/validate_skills.py', '.github/workflows/validate-skills.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_skills.py --format=github
      - name: Check catalog freshness
        run: python scripts/validate_skills.py --check-catalog
