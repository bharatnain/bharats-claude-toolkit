name: validate-skills
on:
  push:
    paths: ['skills/**', 'agents/**', 'workflows/**', 'SKILLS.md', 'scripts/validate_skills.py', 'scripts/validate_assets.py', '.github/workflows/validate-skills.yml', 'team-profiles/**', 'scripts/quality_gate.py', 'scripts/quality_gate_selftest.py', 'scripts/team_profile_detect.py', '.claude-plugin/**', 'hooks/**']
  pull_request:
    paths: ['skills/**', 'agents/**', 'workflows/**', 'SKILLS.md', 'scripts/validate_skills.py', 'scripts/validate_assets.py', '.github/workflows/validate-skills.yml', 'team-profiles/**', 'scripts/quality_gate.py', 'scripts/quality_gate_selftest.py', 'scripts/team_profile_detect.py', '.claude-plugin/**', 'hooks/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python scripts/validate_skills.py --format=github
      - name: Validate assets
        run: python scripts/validate_assets.py --format=github
      - name: Check catalog freshness
        run: python scripts/validate_skills.py --check-catalog
      - name: Validate team profiles
        run: python scripts/validate_profiles.py --format=github
      - name: Quality gate selftest
        run: python scripts/quality_gate_selftest.py
      # Not --strict: it also fails on warnings this repo keeps on purpose (the plugin
      # name contains "claude"; CLAUDE.md at the root is repo context, not plugin context).
      - name: Validate plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.308
          claude plugin validate .
